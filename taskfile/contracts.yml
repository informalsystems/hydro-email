version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  ### CLEANING TASKS
  clean-all:
    cmds:
      - echo "Cleaning contract builds"
      - |
        rm -rf "{{.PATH_CONTRACT_BUILDS}}"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts" || true

  clean:
    requires:
      vars: [CONTRACT]
    vars:
      BASENAME:
        sh: task contracts:basename CONTRACT={{.CONTRACT}}
      PATH: "{{.PATH_CONTRACT_BUILDS}}/{{.BASENAME}}.wasm"
    cmds:
      - echo "Cleaning {{.CONTRACT}} contract from {{.PATH}}"
      - rm -rf "{{.PATH}}"

  ### BUILDING TASKS
  build-all:
    cmds:
      - for: { var: ALL_CONTRACTS, parallel: true }
        task: build
        vars:
          CONTRACT: "{{.ITEM}}"
      - task: build-proxy
      - task: build-control-center-registry

  build:
    requires:
      vars: [CONTRACT]
    vars:
      BASENAME:
        sh: task contracts:basename CONTRACT={{.CONTRACT}}
      PATH_SRC: "packages/contracts/{{.CONTRACT}}"
      FILENAME: "{{.BASENAME}}.wasm"
      PACKAGE: "{{.CONTRACT_PREFIX}}-{{.KIND}}-{{.CONTRACT}}"
    cmds:
      - echo "Building contract {{.CONTRACT}} at {{.PATH_SRC}}"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts/{{.FILENAME}}" || true
      - mkdir -p "./artifacts"
      - >
        {{.DOCKER_SUDO}} docker run --rm
        -v "{{.PATH_REPO_ROOT}}:/code"
        --mount type=volume,source="{{.CW_OPTIMIZER_CACHE}}_cache",target=/target
        --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry
        {{.DOCKER_IMAGE_COSMWASM_OPTIMIZER}} "{{.PATH_SRC}}"
      - mkdir -p "{{.PATH_CONTRACT_BUILDS}}"
      - cp -r "./artifacts/{{.FILENAME}}" "{{.PATH_CONTRACT_BUILDS}}/"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts/{{.FILENAME}}" || true
      - echo "Built contract at {{.PATH_CONTRACT_BUILDS}}/{{.FILENAME}}"
      -
  build-proxy:
    vars:
      PATH_SRC: "hydro/contracts/inflow/proxy"
      FILENAME_SRC: "proxy.wasm"
      BASENAME:
        sh: task contracts:basename CONTRACT="proxy"
      FILENAME_DEST: "{{.BASENAME}}.wasm"
    cmds:
      - echo "Building proxy contract at {{.PATH_SRC}}"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts/{{.FILENAME_SRC}}" || true
      - mkdir -p "./artifacts"
      - >
        {{.DOCKER_SUDO}} docker run --rm
        -v "{{.PATH_REPO_ROOT}}:/code"
        --mount type=volume,source="{{.CW_OPTIMIZER_CACHE}}_cache",target=/target
        --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry
        {{.DOCKER_IMAGE_COSMWASM_OPTIMIZER}} "{{.PATH_SRC}}"
      - mkdir -p "{{.PATH_CONTRACT_BUILDS}}"
      - cp -r "./artifacts/{{.FILENAME_SRC}}" "{{.PATH_CONTRACT_BUILDS}}/{{.FILENAME_DEST}}"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts/{{.FILENAME_SRC}}" || true
      - echo "Built contract at {{.PATH_CONTRACT_BUILDS}}/{{.FILENAME_DEST}}"

  build-control-center-registry:
    desc: "Build Hydro's shared control-center registry"
    cmds:
      - >
        {{.DOCKER_SUDO}} docker run --rm
        -v "{{.PATH_REPO_ROOT}}/hydro:/code"
        --mount type=volume,source="{{.CW_OPTIMIZER_CACHE}}_hydro_cache",target=/target
        --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry
        {{.DOCKER_IMAGE_COSMWASM_OPTIMIZER}} "contracts/inflow/control-center-registry"
      - mkdir -p "{{.PATH_CONTRACT_BUILDS}}"
      - cp "{{.PATH_REPO_ROOT}}/hydro/artifacts/control_center_registry.wasm" "{{.PATH_CONTRACT_BUILDS}}/app_contract_control_center_registry.wasm"

  build-local-control-center:
    desc: "Build Hydro's control center for the local email flow"
    sources:
      - "{{.PATH_REPO_ROOT}}/hydro/contracts/inflow/control-center/**/*"
      - "{{.PATH_REPO_ROOT}}/hydro/packages/interface/**/*"
      - "{{.PATH_REPO_ROOT}}/hydro/Cargo.toml"
      - "{{.PATH_REPO_ROOT}}/hydro/Cargo.lock"
    generates:
      - "{{.PATH_CONTRACT_BUILDS}}/app_contract_local_control_center.wasm"
    cmds:
      - >
        {{.DOCKER_SUDO}} docker run --rm
        -v "{{.PATH_REPO_ROOT}}/hydro:/code"
        --mount type=volume,source="{{.CW_OPTIMIZER_CACHE}}_hydro_cache",target=/target
        --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry
        {{.DOCKER_IMAGE_COSMWASM_OPTIMIZER}} "contracts/inflow/control-center"
      - mkdir -p "{{.PATH_CONTRACT_BUILDS}}"
      - cp "{{.PATH_REPO_ROOT}}/hydro/artifacts/control_center.wasm" "{{.PATH_CONTRACT_BUILDS}}/app_contract_local_control_center.wasm"

  ### SCHEMA TASKS
  schema-all:
    cmds:
      - for: { var: ALL_CONTRACTS, parallel: true }
        task: schema
        vars:
          CONTRACT: "{{.ITEM}}"

  schema:
    requires:
      vars: [CONTRACT]
    vars:
      BASENAME:
        sh: task contracts:basename CONTRACT={{.CONTRACT}}
      PATH_SRC: "packages/contracts/{{.CONTRACT}}"
      FILENAME: "{{.BASENAME}}.wasm"
      PACKAGE: "{{.CONTRACT_PREFIX}}-{{.KIND}}-{{.CONTRACT}}"
    cmds:
      - echo "Building schema for contract {{.CONTRACT}} at {{.PATH_SRC}}"
      - rm -rf "{{.PATH_CONTRACT_SCHEMA}}/{{.CONTRACT}}"
      - mkdir -p "{{.PATH_CONTRACT_SCHEMA}}"
      - cd "{{.PATH_SRC}}" && cargo run --bin schema
      - rm -rf "{{.PATH_SRC}}/schema/cw_schema"
      - mv "{{.PATH_SRC}}/schema" "{{.PATH_CONTRACT_SCHEMA}}/{{.CONTRACT}}"
      - echo ""
      - echo "✅ Built schema for contract {{.CONTRACT}} at {{.PATH_CONTRACT_SCHEMA}}/{{.CONTRACT}}"

  ### QUERY TASKS

  query-service-handler-emails:
    vars:
      ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_INSTANTIATE}}" | jq -r '.address'
    cmds:
      - >
        task helper-exec -- query-service-handler-emails
        --address={{.ADDRESS}}
        --chain={{.CHAIN_KEY}}

  query-proxy-state:
    vars:
      ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_PROXY_INSTANTIATE}}" | jq -r '.address'
    cmds:
      - >
        task helper-exec -- query-proxy-state
        --address={{.ADDRESS}}
        --chain={{.CHAIN_KEY}}

  query-proxy-config:
    vars:
      ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_PROXY_INSTANTIATE}}" | jq -r '.address'
    cmds:
      - >
        task helper-exec -- query-proxy-config
        --address={{.ADDRESS}}
        --chain={{.CHAIN_KEY}}

  ### HELPERS
  basename:
    requires:
      vars: [CONTRACT]
    vars:
      NAME: "{{.CONTRACT_PREFIX}}_{{.CONTRACT}}"
    cmds:
      - echo "{{ replace "-" "_" .NAME }}"
