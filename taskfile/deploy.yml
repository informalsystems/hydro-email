version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  ### CLEANING TASKS
  clean:
    cmds:
      - rm -rf "{{.PATH_DEPLOYMENTS}}"

  ###################################################################
  ######################## ALL  #####################################
  ###################################################################

  artifacts:
    preconditions:
      - sh: '[ -n "{{.HYDRO_COMMITTEE_ADDRESS}}" ] && [ -n "{{.DEPLOY_USER_REGISTRY_ADMIN_ADDRESS}}" ]'
        msg: "Set HYDRO_COMMITTEE_ADDRESS and DEPLOY_USER_REGISTRY_ADMIN_ADDRESS"
    cmds:
      - task: all-upload-contracts-and-middleware
      - task: components-upload-all
      - task: middleware-instantiate
        vars:
          MANAGER_CODE_ID:
            sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_SERVICE_MANAGER_CODE_ID}}" | jq -r '.code_id'
          REGISTRY_CODE_ID:
            sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_STAKE_REGISTRY_CODE_ID}}" | jq -r '.code_id'
          FILENAME: "{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
      - task: contract-instantiate-user-registry
        vars:
          CODE_ID:
            sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_USER_REGISTRY_CODE_ID}}" | jq -r '.code_id'
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_USER_REGISTRY_INSTANTIATE}}"
      - task: contract-instantiate-service-handler
        vars:
          CODE_ID:
            sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_CODE_ID}}" | jq -r '.code_id'
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_INSTANTIATE}}"
      - task: local-control-center
      - task: contract-instantiate-control-center-registry
      - task: contract-configure-user-registry
      - echo ""
      - echo "Deployment artifacts prepared in {{.PATH_DEPLOYMENTS}}"
      - echo ""

  local-control-center:
    internal: true
    desc: "Deploy an empty-vault Hydro control center when targeting the local chain"
    status:
      - '[ "{{.DEPLOY_CHAIN_TARGET}}" != "local" ]'
    cmds:
      - task: :contracts:build-local-control-center
      - task: contract-upload
        vars:
          CONTRACT: "local-control-center"
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_LOCAL_CONTROL_CENTER_CODE_ID}}"
      - task: contract-instantiate-local-control-center

  contract-instantiate-local-control-center:
    internal: true
    vars:
      CODE_ID:
        sh: jq -r '.code_id' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_LOCAL_CONTROL_CENTER_CODE_ID}}"
    cmds:
      - >
        task helper-exec -- instantiate-local-control-center
        --code-id {{.CODE_ID}}
        --output-file {{.DEPLOY_FILENAME_CONTRACT_LOCAL_CONTROL_CENTER_INSTANTIATE}}
        --chain {{.CHAIN_KEY}}

  contract-instantiate-control-center-registry:
    desc: "Instantiate the shared registry with the initial control centers"
    preconditions:
      - sh: '[ "{{.DEPLOY_CHAIN_TARGET}}" = "local" ] || [ -n "{{.HYDRO_COMMITTEE_ADDRESS}}" ]'
        msg: "Set HYDRO_COMMITTEE_ADDRESS before deploying the registry on a remote chain"
    vars:
      CODE_ID:
        sh: jq -r '.code_id' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_CONTROL_CENTER_REGISTRY_CODE_ID}}"
      CONTROL_CENTER_ADDRESS:
        sh: |
          if [ "{{.DEPLOY_CHAIN_TARGET}}" = "local" ]; then
            jq -r '.address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_LOCAL_CONTROL_CENTER_INSTANTIATE}}"
          else
            echo "{{.DEPLOY_CONTROL_CENTER_ADDRESS}}"
          fi
    cmds:
      - >
        task helper-exec -- instantiate-control-center-registry
        --code-id {{.CODE_ID}}
        {{if ne .CHAIN_KEY .LOCAL_CHAIN_KEY}}--admin {{.HYDRO_COMMITTEE_ADDRESS}}{{end}}
        --control-centers {{.CONTROL_CENTER_ADDRESS}}
        --output-file {{.DEPLOY_FILENAME_CONTRACT_CONTROL_CENTER_REGISTRY_INSTANTIATE}}
        --chain {{.CHAIN_KEY}}

  proxy:
    internal: true
    desc: "Instantiate a proxy using the shared control-center registry"
    cmds:
      - task: contract-instantiate-proxy
        vars:
          ADMIN_ADDRESS:
            sh: jq -r '.address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_INSTANTIATE}}"
          CODE_ID:
            sh: jq -r '.code_id' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_PROXY_CODE_ID}}"
          CONTROL_CENTER_REGISTRY_ADDRESS:
            sh: jq -r '.address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_CONTROL_CENTER_REGISTRY_INSTANTIATE}}"
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_PROXY_INSTANTIATE}}"

  user:
    cmds:
      - task: contract-register-user

  service:
    cmds:
      - task: service-upload-and-set-uri
        vars:
          ACTIVATE: "true"
      - echo ""
      - echo "Service URI and quorum configured; CLI retains middleware authority until final handoff."
      - echo ""

  operator:
    cmds:
      - task: operator-add-service
        vars:
          ADDR:
            sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}" | jq -r '.service.manager.cosmos.address'
      - task: middleware-operator-set-signing-key
        vars:
          WEIGHT: "{{.WEIGHT | default .DEFAULT_MIDDLEWARE_SIGNER_WEIGHT}}"
          FILENAME: "{{.DEPLOY_FILENAME_MIDDLEWARE_SIGNING_KEY}}"
      - echo ""
      - echo "Operator loaded and signing key/voting weight registered using the CLI wallet."
      - echo ""

  all:
    cmds:
      - task: artifacts
      - task: service
      - task: operator
      - task: middleware-finalize
      - echo "Middleware setup completed and both authorities transferred to the Hydro committee."
      - echo ""
      - echo "Deployment artifacts prepared in {{.PATH_DEPLOYMENTS}}"
      - echo ""
      - task: post-deploy-all

  post-deploy-all:
    vars:
      SERVICE_URI:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}" | jq -r '.uri'
      SERVICE_GATEWAY_URL:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}" | jq -r '.gateway_url'
      SERVICE_MANAGER:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}" | jq -r '.service.manager.cosmos.address'
    cmds:
      - |
        echo "Service Manager Address: {{.SERVICE_MANAGER}}"
      - |
        echo "Service URI: {{.SERVICE_URI}}"
      - |
        echo "Service URL: {{.SERVICE_GATEWAY_URL}}"

  all-upload-contracts-and-middleware:
    cmds:
      # These need to be done serially to avoid sequence errors
      - task: contracts-upload-all
      - task: middleware-upload-all

  ###################################################################
  ######################## SERVICE ##################################
  ###################################################################
  service-activate:
    vars:
      ACTIVATE: "true"
    cmds:
      - task: service-upload-and-set-uri

  service-upload-and-set-uri:
    desc: "Upload the service and initialize URI/quorum using the deployment wallet"
    requires:
      vars: [ACTIVATE]
    cmds:
      - task: service-upload
        vars:
          PATH_CONTRACT_SERVICE_HANDLER_INSTANTIATE: "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_INSTANTIATE}}"
          PATH_MIDDLEWARE_INSTANTIATE: "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
          PATH_COMPONENT_OPERATOR_EMAIL_READER_CID: "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_COMPONENT_OPERATOR_EMAIL_READER_CID}}"
          PATH_COMPONENT_AGGREGATOR_SUBMITTER_CID: "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_COMPONENT_AGGREGATOR_SUBMITTER_CID}}"
          FILENAME: "{{.DEPLOY_FILENAME_SERVICE_CID}}"
          ACTIVATE: "{{.ACTIVATE}}"
      - task: middleware-configure
  service-upload:
    requires:
      vars:
        [
          PATH_CONTRACT_SERVICE_HANDLER_INSTANTIATE,
          PATH_MIDDLEWARE_INSTANTIATE,
          PATH_COMPONENT_OPERATOR_EMAIL_READER_CID,
          PATH_COMPONENT_AGGREGATOR_SUBMITTER_CID,
          FILENAME,
          ACTIVATE,
        ]
    cmds:
      - echo "Uploading Service JSON to IPFS ..."
      - >
        task helper-exec -- upload-service
        --output-file={{.FILENAME}}
        --ipfs-kind={{.IPFS_KIND}}
        --ipfs-api-url={{.IPFS_API_URL}}
        --ipfs-gateway-url={{.IPFS_GATEWAY_URL}}
        --contract-service-handler-instantiation-file="{{.PATH_CONTRACT_SERVICE_HANDLER_INSTANTIATE}}"
        --middleware-instantiation-file="{{.PATH_MIDDLEWARE_INSTANTIATE}}"
        --component-operator-email-reader-cid-file="{{.PATH_COMPONENT_OPERATOR_EMAIL_READER_CID}}"
        --component-aggregator-submitter-cid-file="{{.PATH_COMPONENT_AGGREGATOR_SUBMITTER_CID}}"
        --trigger-cron-schedule="{{.SERVICE_CRON_SCHEDULE}}"
        --operator-fuel-limit={{.EMAIL_READER_FUEL_LIMIT}}
        --operator-time-limit-seconds={{.EMAIL_READER_TIME_LIMIT_SECONDS}}
        --chain={{.CHAIN_KEY}}
        {{ if eq .ACTIVATE "true" }} --activate {{ end }}
      - echo "🚀 Uploaded Service JSON to IPFS and saved info to {{.FILENAME}}"

  ###################################################################
  ######################## MIDDLEWARE ###############################
  ###################################################################
  middleware-upload-all:
    cmds:
      - task: log-skip-upload-middleware
      - task: middleware-upload-all-inner

  middleware-upload-all-inner:
    internal: true
    cmds:
      - task: middleware-upload-service-manager
        vars:
          FILENAME: "{{.DEPLOY_FILENAME_MIDDLEWARE_SERVICE_MANAGER_CODE_ID}}"
      - task: middleware-upload-stake-registry
        vars:
          FILENAME: "{{.DEPLOY_FILENAME_MIDDLEWARE_STAKE_REGISTRY_CODE_ID}}"

  middleware-upload-service-manager:
    requires:
      vars: [FILENAME]
    cmds:
      - task: contract-upload
        vars:
          CONTRACT: service-manager
          FILENAME: "{{.FILENAME}}"

  middleware-upload-stake-registry:
    requires:
      vars: [FILENAME]
    cmds:
      - task: contract-upload
        vars:
          CONTRACT: stake-registry
          FILENAME: "{{.FILENAME}}"

  middleware-instantiate:
    deps: [assert-account-exists]
    requires:
      vars: [MANAGER_CODE_ID, REGISTRY_CODE_ID, FILENAME, HYDRO_COMMITTEE_ADDRESS]
    cmds:
      - >
        task helper-exec -- instantiate-middleware
        --manager-code-id {{.MANAGER_CODE_ID}}
        --registry-code-id {{.REGISTRY_CODE_ID}}
        --committee-address {{.HYDRO_COMMITTEE_ADDRESS}}
        --output-file {{.FILENAME}}
        --chain {{.CHAIN_KEY}}
      - echo "Middleware instantiated with temporary CLI authority; final handoff follows service and operator setup."

  middleware-configure:
    desc: "Initialize URI/quorum using the CLI wallet while retaining bootstrap authority"
    vars:
      ADDR:
        sh: jq -r '.service_manager_address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
      URI:
        sh: jq -r '.uri' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}"
      NUMERATOR: "{{.QUORUM_NUMERATOR | default .DEFAULT_MIDDLEWARE_QUORUM_NUMERATOR}}"
      DENOMINATOR: "{{.QUORUM_DENOMINATOR | default .DEFAULT_MIDDLEWARE_QUORUM_DENOMINATOR}}"
    cmds:
      - >
        task helper-exec -- configure-middleware
        --address "{{.ADDR}}" --uri "{{.URI}}"
        --numerator "{{.NUMERATOR}}" --denominator "{{.DENOMINATOR}}"
        --output-file middleware-configure.json --chain {{.CHAIN_KEY}}

  middleware-finalize:
    desc: "Verify URI/quorum/operators, then transfer both middleware authorities to the committee"
    vars:
      ADDR:
        sh: jq -r '.service_manager_address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
      URI:
        sh: jq -r '.uri' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}"
      NUMERATOR: "{{.QUORUM_NUMERATOR | default .DEFAULT_MIDDLEWARE_QUORUM_NUMERATOR}}"
      DENOMINATOR: "{{.QUORUM_DENOMINATOR | default .DEFAULT_MIDDLEWARE_QUORUM_DENOMINATOR}}"
      REGISTRY:
        sh: jq -r '.registry_address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
      COMMITTEE:
        sh: jq -er '.committee_address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
      OPERATOR_FILES:
        sh: |
          for operator_number in $(seq 1 {{.OPERATORS | default "1"}}); do
            printf '"%s/%s-%s.json" ' "{{.PATH_DEPLOYMENTS}}" "{{trimSuffix ".json" .DEPLOY_FILENAME_MIDDLEWARE_SIGNING_KEY}}" "$operator_number"
          done
    cmds:
      - >
        task helper-exec -- finalize-middleware
        --address "{{.ADDR}}" --registry-address "{{.REGISTRY}}" --uri "{{.URI}}"
        --committee-address "{{.COMMITTEE}}"
        --numerator "{{.NUMERATOR}}" --denominator "{{.DENOMINATOR}}"
        --operator-files {{.OPERATOR_FILES}}
        --output-file middleware-finalize.json --chain {{.CHAIN_KEY}}

  middleware-set-quorum:
    vars:
      SERVICE_MANAGER_ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}" | jq -r '.service_manager_address'
      MIDDLEWARE_QUORUM_NUMERATOR: "{{.QUORUM_NUMERATOR | default .DEFAULT_MIDDLEWARE_QUORUM_NUMERATOR}}"
      MIDDLEWARE_QUORUM_DENOMINATOR: "{{.QUORUM_DENOMINATOR | default .DEFAULT_MIDDLEWARE_QUORUM_DENOMINATOR}}"
    cmds:
      - >
        task helper-exec -- set-quorum
        --address "{{.SERVICE_MANAGER_ADDRESS}}"
        --numerator "{{.MIDDLEWARE_QUORUM_NUMERATOR}}"
        --denominator "{{.MIDDLEWARE_QUORUM_DENOMINATOR}}"
        --output-file middleware-set-quorum.json
        --chain {{.CHAIN_KEY}}
        {{if eq (.BROADCAST | default "false") "true"}}--broadcast{{end}}

  middleware-set-service-uri:
    requires:
      vars: [ADDR, URI]
    cmds:
      - >
        task helper-exec -- set-service-uri
        --address "{{.ADDR}}"
        --uri "{{.URI}}"
        --output-file middleware-set-service-uri.json
        --chain {{.CHAIN_KEY}}
        {{if eq (.BROADCAST | default "false") "true"}}--broadcast{{end}}

  middleware-verify-service-uri:
    vars:
      ADDR:
        sh: jq -r '.service_manager_address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}"
      URI:
        sh: jq -r '.uri' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}"
    cmds:
      - >
        task helper-exec -- verify-service-uri
        --address "{{.ADDR}}" --uri "{{.URI}}" --chain {{.CHAIN_KEY}}

  ###################################################################
  ################### MIDDLEWARE / STAKE REGISTRY #####################
  ###################################################################
  middleware-operator-set-signing-key:
    requires:
      vars: [FILENAME]
    vars:
      OPERATORS_RANGE:
        sh: seq 1 {{.OPERATORS | default "1"}}
    cmds:
      - for: { var: OPERATORS_RANGE }
        task: middleware-operator-set-signing-key-{{.ITEM}}
        vars:
          WEIGHT: "{{.WEIGHT}}"
          FILENAME: "{{.FILENAME}}"

  middleware-operator-set-signing-key-*:
    requires:
      vars: [WEIGHT, FILENAME]
    vars:
      WAVS_INSTANCE: "{{index .MATCH 0}}"
      FILENAME: '{{trimSuffix ".json" .FILENAME}}-{{.WAVS_INSTANCE}}.json'
      WEIGHT: "{{.WEIGHT | default .DEFAULT_MIDDLEWARE_SIGNER_WEIGHT}}"
      OPERATOR_MNEMONIC:
        sh: task backend:get-wavs-operator-signing-mnemonic-{{.WAVS_INSTANCE}}
      EVM_OPERATOR_ADDRESS:
        sh: cast wallet address --mnemonic "{{.OPERATOR_MNEMONIC}}"
      SERVICE_MANAGER_ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}" | jq -r '.service_manager_address'
      STAKE_REGISTRY_ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}" | jq -r '.registry_address'
      WAVS_URL:
        sh: task backend:get-wavs-url-{{.WAVS_INSTANCE}}
    cmds:
      - echo "Setting signing key for service manager {{.SERVICE_MANAGER_ADDRESS}}..."
      - >
        task helper-exec -- operator-set-signing-key
        --output-file={{.FILENAME}}
        --service-manager-address={{.SERVICE_MANAGER_ADDRESS}}
        --stake-registry-address={{.STAKE_REGISTRY_ADDRESS}}
        --evm-operator-address={{.EVM_OPERATOR_ADDRESS}}
        --wavs-url={{.WAVS_URL}}
        --weight={{.WEIGHT}}
        --chain={{.CHAIN_KEY}}
        {{if eq (.BROADCAST | default "true") "true"}}--broadcast{{end}}
      - echo "Signing-key transaction saved to {{.FILENAME}}"

  ###################################################################
  ##################### OPERATOR / SERVICE ##########################
  ###################################################################
  operator-add-service:
    vars:
      OPERATORS_RANGE:
        sh: seq 1 {{.OPERATORS | default "1"}}
      ADDR_FROM_FILE:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}" | jq -r '.service.manager.cosmos.address'
      ADDR: "{{.ADDR | default .ADDR_FROM_FILE}}"
    cmds:
      - for: { var: OPERATORS_RANGE }
        task: operator-add-service-{{.ITEM}}-{{.ADDR}}

  operator-add-service-*-*:
    vars:
      WAVS_INSTANCE: "{{index .MATCH 0}}"
      ADDR: "{{index .MATCH 1}}"
      WAVS_URL:
        sh: task backend:get-wavs-url-{{.WAVS_INSTANCE}}
    cmds:
      - task: middleware-verify-service-uri
      - |
        echo "Adding service to operator {{.WAVS_INSTANCE}} at endpoint {{.WAVS_URL}}"
      - >
        task helper-exec -- operator-add-service
        --wavs-url {{.WAVS_URL}}
        --service-manager-address "{{.ADDR}}"
        --chain={{.CHAIN_KEY}}
      - echo "🚀 Added service for operator {{.WAVS_INSTANCE}}"

  operator-delete-service:
    vars:
      OPERATORS_RANGE:
        sh: seq 1 {{.OPERATORS | default "1"}}
      ADDR_FROM_FILE:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_SERVICE_CID}}" | jq -r '.service.manager.cosmos.address'
      ADDR: "{{.ADDR | default .ADDR_FROM_FILE}}"
    cmds:
      - for: { var: OPERATORS_RANGE }
        task: operator-delete-service-{{.ITEM}}-{{.ADDR}}

  operator-delete-service-*-*:
    vars:
      WAVS_INSTANCE: "{{index .MATCH 0}}"
      ADDR: "{{index .MATCH 1}}"
      WAVS_URL:
        sh: task backend:get-wavs-url-{{.WAVS_INSTANCE}}
    cmds:
      - echo "Deleting service for operator {{.WAVS_INSTANCE}}..."
      - >
        task helper-exec -- operator-delete-service
        --wavs-url {{.WAVS_URL}}
        --service-manager-address "{{.ADDR}}"
        --chain={{.CHAIN_KEY}}

  ###################################################################
  ######################## CONTRACTS #################################
  ###################################################################
  contracts-upload-all:
    cmds:
      - task: log-skip-upload-contracts
      - task: contracts-upload-all-inner

  contracts-upload-all-inner:
    internal: true
    cmds:
      - task: contract-upload
        vars:
          CONTRACT: service-handler
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_CODE_ID}}"
      - task: contract-upload
        vars:
          CONTRACT: proxy
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_PROXY_CODE_ID}}"
      - task: contract-upload
        vars:
          CONTRACT: control-center-registry
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_CONTROL_CENTER_REGISTRY_CODE_ID}}"
      - task: contract-upload
        vars:
          CONTRACT: user-registry
          FILENAME: "{{.DEPLOY_FILENAME_CONTRACT_USER_REGISTRY_CODE_ID}}"

  contract-upload:
    deps: [assert-account-exists]
    requires:
      vars: [CONTRACT, FILENAME]
    vars:
      SKIP_UPLOAD_CONTRACTS: '{{ .SKIP_UPLOAD_CONTRACTS | default "false" }}'
    status:
      - '[ "{{.SKIP_UPLOAD_CONTRACTS}}" = "true" ]'
    cmds:
      - echo "Uploading contract {{.CONTRACT}}..."
      - task helper-exec -- upload-contract --kind {{.CONTRACT}} --output-file={{.FILENAME}} --chain={{.CHAIN_KEY}}
      - echo "🚀 Uploaded contract {{.CONTRACT}} and saved info to {{.FILENAME}}"

  contract-instantiate-service-handler:
    deps: [assert-account-exists]
    requires:
      vars: [FILENAME, CODE_ID]
    vars:
      USER_REGISTRY_ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_USER_REGISTRY_INSTANTIATE}}" | jq -r '.address'
      AUTH_ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_MIDDLEWARE_INSTANTIATE}}" | jq -r '.service_manager_address'
      AUTH_KIND: "service_manager"
    cmds:
      - echo "Instantiating Service Handler contract..."
      - >
        task helper-exec -- instantiate-service-handler
        --output-file {{.FILENAME}}
        --code-id {{.CODE_ID}}
        --auth-address {{.AUTH_ADDRESS}}
        --auth-kind {{.AUTH_KIND}}
        --user-registry-address {{.USER_REGISTRY_ADDRESS}}
        --chain {{.CHAIN_KEY}}
      - echo "🚀 Instantiated Service Handler contract and saved info to {{.FILENAME}}"

  contract-instantiate-user-registry:
    deps: [assert-account-exists]
    requires:
      vars: [FILENAME, CODE_ID, DEPLOY_USER_REGISTRY_ADMIN_ADDRESS]
    cmds:
      - echo "Instantiating User Registry contract..."
      - >
        task helper-exec -- instantiate-user-registry
        --admin {{.DEPLOY_USER_REGISTRY_ADMIN_ADDRESS}}
        --output-file {{.FILENAME}}
        --code-id {{.CODE_ID}}
        --chain {{.CHAIN_KEY}}
      - echo "🚀 Instantiated User Registry contract and saved info to {{.FILENAME}}"

  contract-configure-user-registry:
    desc: "Configure the proxy factory once and hand registry ownership to the DAO"
    preconditions:
      - sh: '[ -n "{{.HYDRO_COMMITTEE_ADDRESS}}" ]'
        msg: "Set HYDRO_COMMITTEE_ADDRESS for registry ownership"
    vars:
      REGISTRY:
        sh: jq -r '.address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_USER_REGISTRY_INSTANTIATE}}"
      PROXY_CODE_ID:
        sh: jq -r '.code_id' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_PROXY_CODE_ID}}"
      HANDLER:
        sh: jq -r '.address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_SERVICE_HANDLER_INSTANTIATE}}"
      CENTERS:
        sh: jq -r '.address' "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_CONTROL_CENTER_REGISTRY_INSTANTIATE}}"
    cmds:
      - >
        task helper-exec -- configure-user-registry
        --user-registry-address {{.REGISTRY}}
        --proxy-code-id {{.PROXY_CODE_ID}}
        --service-handler {{.HANDLER}}
        --control-center-registry {{.CENTERS}}
        --owner {{.HYDRO_COMMITTEE_ADDRESS}}
        --output-file user-registry-configure.json
        --chain {{.CHAIN_KEY}}

  contract-instantiate-proxy:
    deps: [assert-account-exists]
    requires:
      vars: [FILENAME, CODE_ID, ADMIN_ADDRESS, CONTROL_CENTER_REGISTRY_ADDRESS]
    cmds:
      - echo "Instantiating Proxy contract..."
      - >
        task helper-exec -- instantiate-proxy
        --output-file {{.FILENAME}}
        --code-id {{.CODE_ID}}
        --admins {{.ADMIN_ADDRESS}}
        --control-center-registry {{.CONTROL_CENTER_REGISTRY_ADDRESS}}
        --chain {{.CHAIN_KEY}}
      - echo "🚀 Instantiated Proxy contract and saved info to {{.FILENAME}}"

  contract-register-user:
    vars:
      EMAIL_ADDRESS: "{{.EMAIL_ADDRESS | default .DEPLOY_REGISTER_USER_EMAIL}}"
      USER_REGISTRY_ADDRESS:
        sh: cat "{{.PATH_DEPLOYMENTS}}/{{.DEPLOY_FILENAME_CONTRACT_USER_REGISTRY_INSTANTIATE}}" | jq -r '.address'
    cmds:
      - echo "Registering user for {{.EMAIL_ADDRESS}}..."
      - >
        task helper-exec -- contract-register-user
        --email-address {{.EMAIL_ADDRESS}}
        --user-registry-address {{.USER_REGISTRY_ADDRESS}}
        --chain {{.CHAIN_KEY}}
        {{if eq (.BROADCAST | default "false") "true"}}--broadcast{{end}}
      - echo "Prepared registration for {{.EMAIL_ADDRESS}} on User Registry contract"

  ###################################################################
  ######################## COMPONENTS ###############################
  ###################################################################
  components-upload-all:
    cmds:
      - task: log-skip-upload-components
      - task: components-upload-all-inner

  components-upload-all-inner:
    internal: true
    cmds:
      - task: component-upload
        vars:
          COMPONENT: email-reader
          KIND: operator
          FILENAME: "{{.DEPLOY_FILENAME_COMPONENT_OPERATOR_EMAIL_READER_CID}}"
      - task: component-upload
        vars:
          COMPONENT: submitter
          KIND: aggregator
          FILENAME: "{{.DEPLOY_FILENAME_COMPONENT_AGGREGATOR_SUBMITTER_CID}}"

  component-upload:
    requires:
      vars: [COMPONENT, KIND, FILENAME]
    vars:
      SKIP_UPLOAD_COMPONENTS: '{{ .SKIP_UPLOAD_COMPONENTS | default "false" }}'
    status:
      - '[ "{{.SKIP_UPLOAD_COMPONENTS}}" = "true" ]'
    cmds:
      - echo "Uploading component {{.COMPONENT}} to IPFS..."
      - >
        task helper-exec -- upload-component
        --kind {{.KIND}}
        --component {{.COMPONENT}}
        --output-file={{.FILENAME}}
        --ipfs-kind {{.IPFS_KIND}}
        --ipfs-api-url {{.IPFS_API_URL}}
        --ipfs-gateway-url {{.IPFS_GATEWAY_URL}}
        --chain={{.CHAIN_KEY}}
      - echo "🚀 Uploaded component {{.COMPONENT}} to IPFS, saved info to {{.FILENAME}}"

  ###################################################################
  ######################## FAUCET   #################################
  ###################################################################

  tap-faucet:
    cmds:
      - task: inner-tap-faucet
        vars:
          MNEMONIC: "CLI_MNEMONIC"

  tap-faucet-all:
    cmds:
      - for: { var: ALL_MNEMONICS_TO_FUND }
        task: inner-tap-faucet
        vars:
          MNEMONIC: "{{.ITEM}}"

  inner-tap-faucet:
    internal: true
    vars:
      MNEMONIC_VALUE:
        sh: echo "${{.MNEMONIC}}"
    env:
      CLI_MNEMONIC: "{{.MNEMONIC_VALUE}}"
    cmds:
      - task helper-exec -- faucet-tap --chain={{.CHAIN_KEY}}

  assert-account-exists:
    cmds:
      - task helper-exec -- assert-account-exists --chain={{.CHAIN_KEY}}

  ###################################################################
  ######################## INFORMATIVE-ONLY #########################
  ###################################################################

  log-skip-upload-middleware:
    vars:
      SKIP_UPLOAD_MIDDLEWARE: '{{ .SKIP_UPLOAD_MIDDLEWARE | default "false" }}'
    status:
      - '[ "{{.SKIP_UPLOAD_MIDDLEWARE}}" != "true" ]'
    cmds:
      - echo ""
      - echo "ℹ️  Skipping middleware uploads."
      - echo ""

  log-skip-upload-contracts:
    vars:
      SKIP_UPLOAD_CONTRACTS: '{{ .SKIP_UPLOAD_CONTRACTS | default "false" }}'
    status:
      - '[ "{{.SKIP_UPLOAD_CONTRACTS}}" != "true" ]'
    cmds:
      - echo ""
      - echo "ℹ️  Skipping contract uploads."
      - echo ""

  log-skip-upload-components:
    vars:
      SKIP_UPLOAD_COMPONENTS: '{{ .SKIP_UPLOAD_COMPONENTS | default "false" }}'
    status:
      - '[ "{{.SKIP_UPLOAD_COMPONENTS}}" != "true" ]'
    cmds:
      - echo ""
      - echo "ℹ️  Skipping component uploads."
      - echo ""
